<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F2FA">
<title>잠시 주차 중입니다 · Best Seoul Taxi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚕</text></svg>">
<style>
  :root{
    --bg:#F4F2FA; --ink:#1F1A33; --sub:#6B6585; --purple:#5B3FD6; --purple-d:#4630B0;
    --yellow:#FFC83D; --line:#E2DEF0; --card:#FFFFFF;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex; justify-content:center;
  }
  main{
    width:100%; max-width:440px; min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 22px 24px; text-align:center;
  }
  .brand{font-size:14px; font-weight:700; color:var(--purple); letter-spacing:.02em; margin:0 0 18px}
  .car{width:min(300px,82vw); height:auto; display:block; margin:6px auto 4px}
  .hazard{animation:blink 1s steps(1,end) infinite}
  @keyframes blink{50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.hazard{animation:none}}
  h1{font-size:30px; line-height:1.25; margin:18px 0 10px; font-weight:800; letter-spacing:-.02em}
  .lead{font-size:17px; line-height:1.6; color:var(--sub); margin:0 0 4px}
  .en{font-size:14px; color:var(--sub); opacity:.8; margin:0 0 26px}
  .actions{width:100%; display:grid; gap:12px; margin-top:auto}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; min-height:64px; border-radius:18px;
    font-size:20px; font-weight:800; text-decoration:none;
    border:0; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn:focus-visible{outline:3px solid var(--yellow); outline-offset:3px}
  .call{background:var(--purple); color:#fff}
  .call:active{background:var(--purple-d)}
  .sms{background:var(--card); color:var(--purple); border:2px solid var(--purple)}
  .btn svg{width:24px;height:24px;flex:none}
  .btn small{display:block;font-size:12px;font-weight:600;opacity:.8}
  .foot{font-size:12px; color:var(--sub); margin:22px 0 0; line-height:1.6}
</style>
</head>
<body>
<main>
  <p class="brand">Best Seoul Taxi</p>

  <svg class="car" viewBox="0 0 320 170" role="img" aria-label="주차된 택시">
    <ellipse cx="160" cy="152" rx="138" ry="8" fill="#DCD7EC"/>
    <!-- 택시등 -->
    <rect x="132" y="22" width="56" height="16" rx="4" fill="#FFC83D" stroke="#1F1A33" stroke-width="3"/>
    <text x="160" y="34.5" text-anchor="middle" font-size="10" font-weight="800" fill="#1F1A33" font-family="sans-serif">TAXI</text>
    <!-- 차체 -->
    <path d="M70 66 Q82 40 120 38 L206 38 Q236 40 252 66 L286 74 Q302 78 302 96 L302 120 Q302 128 294 128 L26 128 Q18 128 18 120 L18 98 Q18 78 38 74 Z" fill="#FFC83D" stroke="#1F1A33" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- 창문 -->
    <path d="M84 68 Q94 48 122 47 L156 47 L156 68 Z" fill="#CFE6F7" stroke="#1F1A33" stroke-width="3"/>
    <path d="M166 47 L204 47 Q228 49 240 68 L166 68 Z" fill="#CFE6F7" stroke="#1F1A33" stroke-width="3"/>
    <!-- 옆면 글자 -->
    <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#5B3FD6" font-family="sans-serif">Best Seoul Taxi</text>
    <!-- 비상등(앞·뒤) -->
    <rect class="hazard" x="290" y="84" width="12" height="10" rx="3" fill="#FF8A00"/>
    <rect class="hazard" x="18" y="84" width="12" height="10" rx="3" fill="#FF8A00"/>
    <!-- 바퀴 -->
    <circle cx="82" cy="128" r="22" fill="#1F1A33"/><circle cx="82" cy="128" r="9" fill="#BDB8CC"/>
    <circle cx="240" cy="128" r="22" fill="#1F1A33"/><circle cx="240" cy="128" r="9" fill="#BDB8CC"/>
  </svg>

  <h1>잠시 주차 중입니다</h1>
  <p class="lead">차를 빼야 하시면<br>전화나 문자를 주세요. 바로 가겠습니다.</p>
  <p class="en">Parked for a moment. Please call or text me.</p>

  <div class="actions">
    <a class="btn call" id="callBtn" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      <span>전화 걸기<small>Call</small></span>
    </a>
    <a class="btn sms" id="smsBtn" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM7 9h10v2H7V9zm6 5H7v-2h6v2zm4-6H7V6h10v2z"/></svg>
      <span>문자 보내기<small>Text</small></span>
    </a>
  </div>

  <p class="foot">문자를 누르면 "차량 이동 부탁드립니다" 문구가 미리 들어갑니다.</p>
</main>

<script>
  // 번호는 화면에 표시하지 않고, 누를 때만 연결합니다.
  var p = ['010','3332','7606'].join('');
  var msg = '차량 이동 부탁드립니다. (주차 QR로 연락드려요)';
  var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  document.getElementById('callBtn').href = 'tel:' + p;
  document.getElementById('smsBtn').href = 'sms:' + p + (ios ? '&' : '?') + 'body=' + encodeURIComponent(msg);
</script>
</body>
</html>
